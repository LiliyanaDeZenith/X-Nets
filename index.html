<script id="fx-js">
(()=>{try{
 if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
 const app=document.getElementById('app');if(!app)return;
 let last='',lk=null,lkT=0,nvT=0;const cnts=new WeakMap();
 const cnt=v=>v.querySelectorAll('.stats b').forEach(b=>{const n=parseInt(b.textContent,10);if(!(n>0))return;const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/700);b.textContent=Math.round(n*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)})(t0)});
 new MutationObserver(ms=>{
  if(!ms.some(m=>m.target.id==='app'||m.target.id==='ml'))return;
  const v=document.getElementById('view');
  if(v&&typeof S!=='undefined'){const k=[S.r,S.room,S.p].join('|');if(k!==last){last=k;v.classList.add('enter');document.body.classList.add('nv');clearTimeout(nvT);nvT=setTimeout(()=>document.body.classList.remove('nv'),800);cnt(v)}}else if(!v)last='';
  const m=document.getElementById('ml');
  if(m){const all=m.querySelectorAll('.bw'),n=all.length,p=cnts.get(m);if(p!==undefined&&n>p)[...all].slice(p).forEach(x=>x.classList.add('pop'));cnts.set(m,n)}
  if(lk){const b=document.querySelector('[data-a="like"][data-v="'+lk+'"]');if(b&&b.getAttribute('aria-pressed')==='true')b.classList.add('beat');lk=null}
 }).observe(app,{childList:true,subtree:true});
 document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-a="like"]');if(b){lk=b.dataset.v;clearTimeout(lkT);lkT=setTimeout(()=>{lk=null},4000)}},true);
 document.addEventListener('pointerdown',e=>{const t=e.target.closest&&e.target.closest('.btn,.sbtn,.li,.ni,.tabs a,.seg a,.ib,.bar a');if(!t)return;const r=t.getBoundingClientRect(),d=Math.max(r.width,r.height)*2,s=document.createElement('span');s.className='rp';s.style.cssText='width:'+d+'px;height:'+d+'px;left:'+(e.clientX-r.left-d/2)+'px;top:'+(e.clientY-r.top-d/2)+'px';t.appendChild(s);setTimeout(()=>s.remove(),650)},{passive:true});
 addEventListener('scroll',()=>document.body.classList.toggle('scrolled',scrollY>6),{passive:true});
}catch(e){}})();
</script>
<script id="dl-js">
(()=>{
 const ext=l=>/mp3|audio/i.test(l)?'.mp3':/^\s*foto/i.test(l)?'.jpg':'.mp4',say=t=>{try{toast(t)}catch(e){}};
 document.addEventListener('click',async e=>{
  const a=e.target.closest&&e.target.closest('a[download][target="_blank"]');if(!a)return;
  e.preventDefault();e.stopPropagation();
  if(a.dataset.busy)return;a.dataset.busy='1';
  const lab=a.textContent.trim(),href=a.href;
  try{
   a.textContent='Mengunduh...';
   const r=await fetch(href);if(!r.ok)throw new Error(r.status);
   const tot=+r.headers.get('content-length')||0,rd=r.body.getReader(),ch=[];let got=0;
   for(;;){const x=await rd.read();if(x.done)break;ch.push(x.value);got+=x.value.length;if(tot)a.textContent='Mengunduh '+Math.round(got/tot*100)+'%'}
   const u=URL.createObjectURL(new Blob(ch,{type:r.headers.get('content-type')||''})),l=document.createElement('a');
   l.href=u;l.download='tiktok-'+Date.now()+ext(lab);document.body.appendChild(l);l.click();l.remove();
   setTimeout(()=>URL.revokeObjectURL(u),60000);say('Unduhan dimulai.');
  }catch(err){
   say('Unduh langsung diblokir server, dibuka di tab baru.');window.open(href,'_blank','noopener');
  }finally{if(a.isConnected)a.textContent=lab;delete a.dataset.busy}
 },true);
})();
</script>
