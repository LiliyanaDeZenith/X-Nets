<script>
emailjs.init("q9JcJnOO17iQOvZpz");

async function kirimKode() {
  const email = document.getElementById("email").value;
  if(!email) return alert("Isi email dulu!");
  
  // Bikin kode 6 digit di Supabase
  const { data: code, error } = await supabase.rpc("request_code", { email_in: email });
  if(error) return alert("Gagal bikin kode: " + error.message);

  // Kirim via EmailJS
  await emailjs.send("service_448sksw", "template_mvi5kya", {
    to_email: email,
    code: code
  });
  
  alert("Kode 6 digit udah dikirim, cek Gmail kamu!");
}

async function verifikasiKode() {
  const email = document.getElementById("email").value;
  const kode = document.getElementById("kode").value;
  const { data: ok } = await supabase.rpc("verify_code", { email_in: email, code_in: kode });
  if (ok) alert("Bener! Lanjut daftar.");
  else alert("Kode salah / kadaluarsa.");
}
</script>
